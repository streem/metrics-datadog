name: Test Changes

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  JAVA_VERSION: 11

on:
  pull_request:
    paths-ignore:
      - '*.md'

# All jobs need to be kept in sync with their counterparts in release.yaml
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build project and run tests
        run: ./gradlew build check --stacktrace

      - name: Bundle the build report
        if: failure()
        run: |
            REPORTS=$(find . -type d -name 'reports')
            if [ -n "$REPORTS" ]; then
              echo "$REPORTS" | zip -@ -r build-reports.zip
            else
              echo "No reports directory found; skipping zip."
              touch build-reports.zip
            fi

      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-report
          path: build-reports.zip
